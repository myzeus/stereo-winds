[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-winds"
version = "0.1.0"
description = "Cross-satellite stereo wind retrieval from geostationary imagery"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
    "h5netcdf>=1.1",
    "netCDF4>=1.6",
    "torch>=2.0",
    "s3fs>=2023.1",
    "filelock>=3.12",
    "zarr>=3.0",
    "pandas>=2.0",
    "pyorbital>=1.7",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
    "cartopy>=0.21",
]
train = [
    "pytorch-lightning>=2.0",
    "wandb>=0.16",
    "mpi4py>=4.0",
]
dev = [
    "pytest>=7.0",
    "pyproj>=3.5",
]

[project.scripts]
stereo-winds = "scripts.run_stereo:main"
stereo-winds-batch = "scripts.run_batch:main"

[tool.setuptools.packages.find]
include = ["stereo_winds*"]
